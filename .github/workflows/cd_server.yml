name: Server deployment
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout github
        uses: actions/checkout@v4
      
      - name: Log in to GitHub container registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: docker build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: true
          tags: ketansayal2004/todo-app-server:${{ github.sha }}
      - name: SSh into machine
        run: |
            echo "${{secrets.SSH_PRIVATE_KEY}}"> ~/ssh_key
            chmod 700 ~/ssh_key

            ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@54.242.2.128 << 'EOF'

            docker pull ketansayal2004/todo-app-server:${{github.sha}}
            docker kill user_server || true
            docker rm user_server || true
            docker run -d --network my_network --name user_server -e DATABASE_URL=postgresql://postgres:mysecret@postgres:5432/postgres -p 3001:3001 ketansayal2004/todo-app-server:${{github.sha}}
            docker ps
            EOF

      

    
    
    